# Verificación en cada PR y en cada push a main (main se despliega solo en Render).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  motor:
    name: Motor (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Puente LoRa compila
        run: python -m py_compile herramientas/puente_serial.py

  prototipo:
    name: Prototipo (sintaxis JS y manifiesto)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node herramientas/revisar_prototipo.mjs

  docker:
    name: Imagen Docker (build y arranque)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tria:ci .
      - name: Arranca y responde
        run: |
          docker run -d --name tria -p 8000:8000 tria:ci
          for i in $(seq 1 30); do
            if curl -fs localhost:8000/version && curl -fs -o /dev/null localhost:8000/; then exit 0; fi
            sleep 1
          done
          docker logs tria
          exit 1
