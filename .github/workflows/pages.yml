# Publica el prototipo (carpeta prototipo/) en GitHub Pages en cada push a main.
# Sitio: https://<dueño>.github.io/tria-rally2026/  ·  La API sigue en Render.
# Si el sitio no aparece: Settings → Pages → Source: "Deploy from a branch", rama gh-pages, carpeta / (root).
name: Pages

on:
  push:
    branches: [main]
    paths: ["prototipo/**", "herramientas/revisar_prototipo.mjs", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    name: Publicar prototipo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Revisar el prototipo antes de publicar
        run: node herramientas/revisar_prototipo.mjs
      - name: Publicar en la rama gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./prototipo
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Prototipo publicado desde ${{ github.sha }}"
