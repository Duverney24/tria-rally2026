# Despliegue en Render (https://render.com) como Blueprint.
# Cada push a la rama main vuelve a desplegar automáticamente.
services:
  - type: web
    name: tria-rally2026
    runtime: python
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn tria.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /version
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Clave para las rutas que cambian el estado (reportes, latidos, vías…). Render la genera;
      # se consulta en el panel del servicio (Environment) y se usa en el prototipo y en el puente LoRa.
      - key: TRIA_CLAVE
        generateValue: true
      # Opcional: TRIA_CARTO_KEY, clave gratuita de mapas base de CARTO (carto.com/basemaps/apikey).
      # No se declara aquí para que el Blueprint no la exija al crearse: si se quiere, se añade en
      # el panel de Render (Environment), que la conserva. Sin ella, el prototipo usa OpenStreetMap.
