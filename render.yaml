# Despliegue en Render (https://render.com) como Blueprint.
# Cada push a la rama main vuelve a desplegar automáticamente.
services:
  - type: web
    name: tria-rally2026
    runtime: python
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn tria.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /version
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Clave para las rutas que cambian el estado (reportes, latidos, vías…). Render la genera;
      # se consulta en el panel del servicio (Environment) y se usa en el prototipo y en el puente LoRa.
      - key: TRIA_CLAVE
        generateValue: true
      # Clave gratuita de mapas base de CARTO (carto.com/basemaps/apikey). Se escribe en el panel de Render.
      # Sin ella, el prototipo usa los mapas base de Esri, que no piden clave.
      - key: TRIA_CARTO_KEY
        sync: false
